# Hermetic end-to-end suite: two throw-away Redis servers plus a container that
# runs the Go test suite against them. Nothing outside these containers is used.
#
#   docker compose -f test/e2e/docker-compose.yml up --build \
#       --abort-on-container-exit --exit-code-from tests
#
# or simply: make e2e

name: redis-walker-e2e

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

  redis-auth:
    image: redis:7-alpine
    command:
      ["redis-server", "--save", "", "--appendonly", "no", "--requirepass", "e2e-secret"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "e2e-secret", "--no-auth-warning", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

  tests:
    build:
      context: ../..
      dockerfile: test/e2e/Dockerfile
    environment:
      REDIS_ADDR: redis:6379
      REDIS_AUTH_ADDR: redis-auth:6379
      REDIS_AUTH_PASSWORD: e2e-secret
    depends_on:
      redis:
        condition: service_healthy
      redis-auth:
        condition: service_healthy
